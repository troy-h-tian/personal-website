  <style>
    .contact-form-wrap { max-width: 560px; }
    .contact-form-wrap .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 600px) {
      .contact-form-wrap .name-row { grid-template-columns: 1fr; gap: 0; }
    }
    .contact-form-wrap .field { margin-bottom: 1rem; }
    .contact-form-wrap label {
      display: block;
      font-family: 'Calibri', sans-serif;
      font-size: 0.8rem;
      color: var(--text);
      margin-bottom: 0.15rem;
    }
    .contact-form-wrap .field-hint { color: var(--muted); }
    .contact-form-wrap input[type="text"],
    .contact-form-wrap input[type="email"] {
      width: 100%;
      padding: 0.6rem 1rem;
      font-family: 'Calibri', sans-serif;
      font-size: 0.95rem;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: border-color 0.15s;
    }
    .contact-form-wrap input:focus {
      outline: none;
      border-color: var(--text);
    }
    .contact-form-wrap textarea {
      width: 100%;
      min-height: 180px;
      padding: 0.85rem 1rem;
      font-family: 'Calibri', sans-serif;
      font-size: 0.95rem;
      line-height: 1.65;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      resize: vertical;
      margin-bottom: 1rem;
      transition: border-color 0.15s;
    }
    .contact-form-wrap textarea:focus {
      outline: none;
      border-color: var(--text);
    }
    .contact-form-wrap .submit-btn {
      font-family: 'Calibri', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--bg);
      background: var(--text);
      border: none;
      padding: 0.55rem 1.25rem;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .contact-form-wrap .submit-btn:hover { opacity: 0.75; }
    .contact-note {
      font-family: 'Calibri', sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }
  </style>
</head>

<main class="container" id="contact-main">
  <h1 class="sr-only">Contact</h1>

  <div class="contact-form-wrap">
    <p class="contact-note">Give me your information.</p>
    <form action="https://formspree.io/f/mvzynwgq" method="POST">
      <input type="hidden" name="_subject" value="Contact information" />
      <div class="name-row">
        <div class="field">
          <label for="info-first-name">First Name</label>
          <input type="text" id="info-first-name" name="first_name" autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="info-last-name">Last Name</label>
          <input type="text" id="info-last-name" name="last_name" autocomplete="family-name" />
        </div>
      </div>
      <div class="field">
        <label for="info-email">Email <span class="field-hint">(required)</span></label>
        <input type="email" id="info-email" name="email" autocomplete="email" required />
      </div>
      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>

  <hr class="divider" />

  <div class="contact-form-wrap">
    <p class="contact-note">Leave anonymous feedback.</p>
    <form action="https://formspree.io/f/mvzynwgq" method="POST">
      <label for="contact-message" class="sr-only">Anonymous message</label>
      <textarea id="contact-message" name="message" placeholder="Write anything…" required aria-label="Anonymous message"></textarea>
      <button type="submit" class="submit-btn">Send</button>
    </form>
  </div>
</main>

<script>
  const themeToggle = document.getElementById('theme-toggle');
  const html = document.documentElement;

  const currentTheme = localStorage.getItem('theme') || 'light';
  if (currentTheme === 'dark') {
    html.classList.add('dark-mode');
    themeToggle.textContent = 'Light Mode';
    themeToggle.setAttribute('aria-label', 'Switch to light mode');
  }

  themeToggle.addEventListener('click', () => {
    html.classList.toggle('dark-mode');
    const isDark = html.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    themeToggle.textContent = isDark ? 'Light Mode' : 'Dark Mode';
    themeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
  });
</script>
