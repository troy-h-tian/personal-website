<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Troy Hanfei Tian</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    .contact-links {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }
    .contact-links a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.4rem 0.9rem;
      border-radius: 4px;
      transition: border-color 0.15s, color 0.15s;
    }
    .contact-links a:hover { color: var(--text); text-decoration: none; }
    .contact-form-wrap { max-width: 560px; }
    .contact-form-wrap textarea {
      width: 100%;
      min-height: 180px;
      padding: 0.85rem 1rem;
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      line-height: 1.65;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      resize: vertical;
      margin-bottom: 1rem;
      transition: border-color 0.15s;
    }
    .contact-form-wrap textarea:focus {
      outline: none;
      border-color: var(--text);
    }
    .contact-form-wrap button {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--bg);
      background: var(--text);
      border: none;
      padding: 0.55rem 1.25rem;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .contact-form-wrap button:hover { opacity: 0.75; }
    .contact-note {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .feedback-heading {
      font-size: 1.1rem;
      font-weight: normal;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<header class="site-header">
  <nav>
    <a href="index.html">About</a>
    <a href="writing.html">Writing</a>
    <a href="contact.html" class="active">Contact</a>
    <button class="theme-toggle" id="theme-toggle">Dark Mode</button>
  </nav>
</header>

<main class="container">
  <h2 class="page-title">Contact</h2>
  <p class="page-desc">Get in touch or leave anonymous feedback.</p>

  <div class="contact-links">
    <a href="https://www.linkedin.com/in/troy-tian" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://github.com/troy-h-tian" target="_blank" rel="noopener">GitHub</a>
    <a href="https://www.lesswrong.com/users/troy-tian" target="_blank" rel="noopener">LessWrong</a>
    <a href="https://substack.com/@tianhanfei" target="_blank" rel="noopener">Substack</a>
    <a href="mailto:troyhtian@g.ucla.edu">troyhtian@g.ucla.edu</a>
  </div>

  <hr class="divider" />

  <h2 class="feedback-heading">Leave Feedback</h2>
  <div class="contact-form-wrap">
    <p class="contact-note">Anonymous. I won't know who you are unless you tell me.</p>
    <form action="https://formspree.io/f/mvzynwgq" method="POST">
      <textarea name="message" placeholder="Write anything..." required></textarea>
      <button type="submit">Send</button>
    </form>
  </div>
</main>

<footer>
  &copy; 2026 Troy Hanfei Tian. All rights reserved.
</footer>

<script>
  const themeToggle = document.getElementById('theme-toggle');
  const html = document.documentElement;

  const currentTheme = localStorage.getItem('theme') || 'light';
  if (currentTheme === 'dark') {
    html.classList.add('dark-mode');
    themeToggle.textContent = 'Light Mode';
  }

  themeToggle.addEventListener('click', () => {
    html.classList.toggle('dark-mode');
    const isDark = html.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    themeToggle.textContent = isDark ? 'Light Mode' : 'Dark Mode';
  });
</script>

</body>
</html>
