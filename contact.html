<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Troy Hanfei Tian</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    .contact-form-wrap { max-width: 560px; }
    .contact-form-wrap textarea {
      width: 100%;
      min-height: 180px;
      padding: 0.85rem 1rem;
      font-family: 'Calibri', sans-serif;
      font-size: 0.95rem;
      line-height: 1.65;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      resize: vertical;
      margin-bottom: 1rem;
      transition: border-color 0.15s;
    }
    .contact-form-wrap textarea:focus {
      outline: none;
      border-color: var(--text);
    }
    .contact-form-wrap .submit-btn {
      font-family: 'Calibri', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--bg);
      background: var(--text);
      border: none;
      padding: 0.55rem 1.25rem;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .contact-form-wrap .submit-btn:hover { opacity: 0.75; }
    .contact-note {
      font-family: 'Calibri', sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<a href="#contact-main" class="skip-link">Skip to main content</a>
<header class="site-header">
  <nav aria-label="Main navigation">
    <a href="index.html">About</a>
    <a href="writing.html">Writing</a>
    <a href="contact.html" class="active">Contact</a>
    <button class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode">Dark Mode</button>
  </nav>
</header>

<main class="container" id="contact-main">
  <h1 class="sr-only">Contact</h1>
  <div class="contact-links">
    <a href="https://www.linkedin.com/in/troy-tian" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://github.com/troy-h-tian" target="_blank" rel="noopener">GitHub</a>
    <a href="https://www.lesswrong.com/users/troy-tian" target="_blank" rel="noopener">LessWrong</a>
    <a href="https://substack.com/@tianhanfei" target="_blank" rel="noopener">Substack</a>
    <a href="mailto:troyhtian@g.ucla.edu">troyhtian@g.ucla.edu</a>
  </div>

  <hr class="divider" />

  <div class="contact-form-wrap">
    <p class="contact-note">Leave anonymous feedback — I won't know who you are unless you tell me!</p>
    <form action="https://formspree.io/f/mvzynwgq" method="POST">
      <label for="contact-message" class="sr-only">Anonymous message</label>
      <textarea id="contact-message" name="message" placeholder="Write anything..." required aria-label="Anonymous message"></textarea>
      <button type="submit" class="submit-btn">Send</button>
    </form>
  </div>
</main>

<footer>
  &copy; 2026 Troy Hanfei Tian. All rights reserved.
</footer>

<script>
  const themeToggle = document.getElementById('theme-toggle');
  const html = document.documentElement;

  const currentTheme = localStorage.getItem('theme') || 'light';
  if (currentTheme === 'dark') {
    html.classList.add('dark-mode');
    themeToggle.textContent = 'Light Mode';
    themeToggle.setAttribute('aria-label', 'Switch to light mode');
  }

  themeToggle.addEventListener('click', () => {
    html.classList.toggle('dark-mode');
    const isDark = html.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    themeToggle.textContent = isDark ? 'Light Mode' : 'Dark Mode';
    themeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
  });
</script>

</body>
</html>
